<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Топ 4 Британські рок групи</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preload" href="assets/fonts/onest-cyrillic-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- Екран завантаження: назва + ноти на нотному стані (js/loader.js) -->
<div class="loader" id="loader" role="status" aria-label="Завантаження презентації">
  <div class="loader__inner">
    <h1 class="loader__title">Топ 4 Британські рок групи</h1>
    <div class="loader__staff"></div>
  </div>
</div>

<div class="intro" id="intro"></div>
<div class="preloader" id="preloader" aria-hidden="true"></div>

<main id="app">

  <!-- Сцена 1: карта Європи -> наїзд на Британію -> всі місця рейтингу по черзі (js/ranking.js) -->
  <section class="map" id="map">
    <div class="map__stage">
      <svg class="map__svg" id="mapSvg" aria-hidden="true"></svg>
      <div class="bgs" id="bgs"></div>
      <div class="cards" id="cards"></div>
      <!-- Фінал: карта віддаляється, і поверх неї проявляється «Дякуємо за увагу» (js/thanks.js) -->
      <div class="thanks" id="thanks"><div class="thanks__stage" id="thanksStage"></div></div>
    </div>
  </section>

</main>

<script src="js/ranking.js"></script>
<script src="js/loader.js"></script>
<script src="js/vendor/lenis.min.js"></script>
<script src="js/scroll.js"></script>
<script src="js/europe-data.js"></script>
<script src="js/preloader.js"></script>
<script src="js/player.js"></script>
<script src="js/map-scene.js"></script>
<script src="js/thanks.js"></script>
</body>
</html>
